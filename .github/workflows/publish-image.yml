name: Publish attested demo image
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require opt-in and default branch
        env:
          ENABLED: ${{ vars.REAL_DEPLOY_ENABLED }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$ENABLED" = true || { echo "REAL_DEPLOY_ENABLED must be true." >&2; exit 1; }
          test "$REF_NAME" = "refs/heads/$DEFAULT_BRANCH" || { echo "Publish from the default branch only." >&2; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run lint && npm test && npm run build

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Attest the published digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record deployment inputs
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Attested demo image"
            echo "- Image: \`$IMAGE@$DIGEST\`"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- No vendor or change-management qualification is implied."
          } >> "$GITHUB_STEP_SUMMARY"
